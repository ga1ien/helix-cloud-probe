<!DOCTYPE html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Not found · Hello Kulti</title>
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--two"></span>
    </div>

    <main id="main" class="shell">
      <section class="hero">
        <p class="eyebrow">Error 404</p>
        <h1 class="hero__title">Nothing <span class="grad">here</span></h1>
        <p class="hero__lede">
          That path does not exist on this server. Static files live under
          <code>public/</code>, and everything above it returns this page.
        </p>
        <div class="hero__cta">
          <a class="btn btn--primary" href="/">Back to Hello Kulti</a>
          <a class="btn btn--ghost" href="/health">Check <code>/health</code></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>Hello Kulti — zero-dependency Node.js server.</p>
      </div>
    </footer>
  </body>
</html>
